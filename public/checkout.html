<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout – AquaLuxe</title><meta name="description" content="AquaLuxe - premium aquarium fish, aquatic plants, driftwood, lights and equipment in Bangladesh.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/store.css"></head>
<body data-page="checkout">
<main>

<section class="page-head"><div class="wrap"><h1>Checkout</h1><p>Just a few details and your order is on its way. No account needed.</p></div></section>
<div class="wrap" id="coWrap"><form class="co" id="coForm">
 <div style="display:grid;gap:22px">
  <div class="box"><h3>1. Delivery details</h3><div id="err" class="msg err" style="display:none"></div>
   <div class="fg"><div class="fg two"><div><label class="l">Full name <em>*</em></label><input class="field" name="name" required minlength="2" autocomplete="name"></div>
    <div><label class="l">Phone number <em>*</em></label><input class="field" name="phone" required inputmode="tel" placeholder="01XXXXXXXXX" autocomplete="tel"></div></div>
    <div class="fg two"><div><label class="l">Email (optional)</label><input class="field" type="email" name="email" autocomplete="email"></div>
    <div><label class="l">District <em>*</em></label><select class="field" name="district" id="district" required></select></div></div>
    <div><label class="l">Full address <em>*</em></label><textarea class="field" name="address" required minlength="6" placeholder="House, road, area, thana"></textarea></div>
    <div><label class="l">Order note (optional)</label><input class="field" name="notes" placeholder="Anything we should know?"></div></div></div>
  <div class="box"><h3>2. Advance payment</h3><div class="pay two">
   <label><input type="radio" name="payment_method" value="bkash" checked><span>bKash</span><small>Send money</small></label>
   <label><input type="radio" name="payment_method" value="nagad"><span>Nagad</span><small>Send money</small></label></div>
   <div class="pay-note" id="payNote"></div><div id="trxWrap" style="margin-top:14px"><label class="l">Transaction ID (optional now – you can add it after placing the order)</label><input class="field" name="trx_id" placeholder="e.g. 9H7K2LMN" maxlength="40" autocomplete="off"></div></div></div>
 <div class="sticky"><div class="box"><h3>Your order</h3><div id="mini"></div>
  <div class="sum-row" style="margin-top:14px"><span>Subtotal</span><span id="sSub"></span></div><div class="sum-row"><span>Delivery <small id="sZone" style="color:var(--muted)"></small></span><span id="sShip"></span></div>
  <div class="sum-row t"><span>Total</span><span id="sTot"></span></div>
  <div class="sum-row adv"><span>Advance to pay now</span><b id="sAdv"></b></div><div class="sum-row"><span>Pay on delivery</span><span id="sBal"></span></div><button class="btn block orange" id="place" type="submit">Place Order</button>
  <p style="color:var(--muted);font-size:.82rem;margin-top:12px;text-align:center">🔒 Advance via bKash/Nagad, the rest in cash on delivery. We will call you to confirm.</p></div></div>
</form></div>
</main>
<script src="/js/store.js"></script>
<script src="/js/bubbles.js"></script>
<script src="/js/chat.js"></script>
</body></html>
